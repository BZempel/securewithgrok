<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First screen mock — SecureWithGrok (family test)</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root {
    --bg: #faf8f5;
    --text: #2b2b2b;
    --muted: #555;
    --quiet: #777;
    --accent: #2f5d62;
    --line: #ddd7cc;
    --card: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.125rem;
    line-height: 1.55;
    color: var(--text);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.25rem 3rem;
  }
  .screen {
    width: 100%;
    max-width: 36rem;
    text-align: center;
  }
  .logo {
    display: block;
    margin: 0 auto 1.5rem;
    max-width: 14rem;
    width: 100%;
    height: auto;
  }
  .logo-text {
    display: block;
    margin: 0 0 1.5rem;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .tagline {
    margin: 0 0 2rem;
    color: var(--muted);
    font-size: 1.15rem;
  }
  .bots {
    display: block;
    width: 100%;
    max-width: 28rem;
    margin: 0 auto 1rem;
    height: auto;
    border-radius: 1rem;
  }
  .bots-slot {
    width: 100%;
    max-width: 28rem;
    margin: 0 auto 1rem;
    min-height: 11rem;
    border-radius: 1rem;
    background: linear-gradient(180deg, #f3f0ea, #e8e3da);
    border: 1px dashed #c9c1b3;
    display: grid;
    place-items: center;
    color: var(--quiet);
    font-size: .95rem;
    padding: 1.25rem;
  }
  .caption-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin: 0 0 1.75rem;
  }
  @media (max-width: 40rem) {
    .caption-row { grid-template-columns: 1fr; }
    /* Path 1 (I'm new) stays on top when stacked */
  }
  .caption-row a {
    display: block;
    padding: 1rem 1.1rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: .75rem;
    text-decoration: none;
    color: var(--accent);
    font-weight: 600;
    font-size: 1.05rem;
  }
  .caption-row a:hover,
  .caption-row a:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47, 93, 98, 0.15);
    outline: none;
  }
  .reassure {
    margin: 0;
    font-size: .95rem;
    color: var(--quiet);
  }
</style>
</head>
<body>
<main class="screen" aria-label="SecureWithGrok first screen mock">

  <!-- When logo is ready: replace the text below with
       <img class="logo" src="../assets/logo.png" alt="SecureWithGrok"> -->
  <p class="logo-text">SecureWithGrok</p>

  <p class="tagline">Friendly help for using Grok bots safely.</p>

  <!-- When the locked two-bot image is ready: replace the slot below with
       <img class="bots" src="../assets/two-bots.png" alt="Two Grok Bot characters: new visitor on the left, existing bot user on the right"> -->
  <div class="bots-slot" role="img" aria-label="Placeholder for locked two-bot image. Left is new visitor. Right is existing bot user.">
    Locked two-bot image<br>
    <span style="font-size:.85rem">Left = I’m new · Right = I have a Grok bot</span>
  </div>

  <div class="caption-row">
    <a href="https://securewithgrok.com/how-it-works">I'm new. Show me what this is</a>
    <a href="keep-it-safe.html">I have a Grok bot. Help me keep it safe</a>
  </div>

  <p class="reassure">No sign-up. No passwords. Just a short look around.</p>
</main>
</body>
</html>
